<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý Combo - RestMan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/dashboard}">RestMan</a><div class="navbar-nav flex-row gap-3"><a class="nav-link" th:href="@{/search}">Thực đơn</a><a class="nav-link" th:href="@{/dishes}">Quản lý món</a><a class="nav-link active" th:href="@{/combo}">Quản lý combo</a><a class="nav-link" th:href="@{/statistics}">Thống kê</a></div><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a></div></nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Quản lý Combo</h1>
    <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4">
        <section class="col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body">
            <h2 class="h5" th:text="${comboId != null and comboId != '' ? 'Cập nhật combo' : 'Tạo combo mới'}">Tạo combo mới</h2>
            <form method="get" th:action="@{/combo}" class="input-group mb-3"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm món để thêm"><button class="btn btn-outline-secondary">Tìm món</button></form>
            <div class="list-group mb-3">
                <div class="list-group-item d-flex justify-content-between align-items-center" th:each="dish : ${dishOptions}">
                    <span><span class="fw-semibold" th:text="${dish.dishName}">Tên món</span><small class="d-block text-secondary" th:text="${dish.category}">Thể loại</small></span>
                    <form method="post" th:action="@{/combo/add-dish}"><input type="hidden" name="dishId" th:value="${dish.id}"><input type="hidden" name="keyword" th:value="${keyword}"><button class="btn btn-sm btn-outline-primary" type="submit">Thêm vào Combo</button></form>
                </div>
                <div class="list-group-item text-secondary" th:if="${#lists.isEmpty(dishOptions)}">Không tìm thấy món ăn.</div>
            </div>
            <h3 class="h6">Danh sách tạm (<span th:text="${#lists.size(selectedDishes)}">0</span>)</h3>
            <ul class="list-group mb-3"><li class="list-group-item d-flex justify-content-between" th:each="dish : ${selectedDishes}">
                <span th:text="${dish.dishName}">Tên món</span><form method="post" th:action="@{'/combo/remove-dish/' + ${dish.id}}"><input type="hidden" name="keyword" th:value="${keyword}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form>
            </li><li class="list-group-item text-secondary" th:if="${#lists.isEmpty(selectedDishes)}">Chưa chọn món.</li></ul>
            <form method="post" th:action="@{/combo/save}">
                <input type="hidden" name="comboId" th:value="${comboId}">
                <label class="form-label">Tên combo</label><input class="form-control mb-2" name="comboName" th:value="${comboName}" required>
                <label class="form-label">Giá</label><input class="form-control mb-2" type="number" name="comboPrice" min="1" step="1000" th:value="${comboPrice}" required>
                <label class="form-label">Mô tả</label><textarea class="form-control mb-3" name="comboDescription" rows="2" th:text="${comboDescription}"></textarea>
                <div th:if="${comboId != null and comboId != ''}" class="mb-3"><div class="form-check" th:each="dish : ${dishOptions}"><input class="form-check-input" type="checkbox" name="dishIds" th:value="${dish.id}" th:checked="${#lists.contains(selectedDishIds,dish.id)}"><label class="form-check-label" th:text="${dish.dishName}"></label></div><small class="text-secondary">Chọn ít nhất 2 món.</small></div>
                <button class="btn btn-warning w-100" type="submit" th:text="${comboId != null and comboId != '' ? 'Cập nhật combo' : 'Xác nhận tạo Combo'}">Xác nhận tạo Combo</button>
            </form>
        </div></div></section>
        <section class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Danh sách Combo</h2>
            <article class="border rounded p-3 mb-3" th:each="combo : ${combos}">
                <div class="d-flex justify-content-between gap-2"><h3 class="h6" th:text="${combo.comboName}">Tên combo</h3><span class="fw-bold" th:text="${#numbers.formatDecimal(combo.price,0,'COMMA',0,'POINT')} + ' VND'">0 VND</span></div>
                <p class="text-secondary" th:text="${combo.description}">Mô tả</p>
                <div class="mb-2"><span class="badge text-bg-light border me-1" th:each="dish : ${combo.dishes}" th:text="${dish.dishName}">Món</span></div>
                <div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/combo(editId=${combo.id})}">Sửa</a><form method="post" th:action="@{'/combo/delete/' + ${combo.id}}" onsubmit="return confirm('Xóa combo này?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div>
            </article>
            <p class="text-secondary" th:if="${#lists.isEmpty(combos)}">Chưa có combo.</p>
        </div></div></section>
    </div>
</main></body></html>
