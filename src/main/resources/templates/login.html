<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestMan - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width:760px">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Đăng nhập RestMan</h1>
            <p class="text-secondary">Đăng nhập để tiếp tục tới khu vực phù hợp với vai trò.</p>
            <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form method="post" th:action="@{/login}" class="mb-4">
                <div class="mb-3"><label class="form-label" for="username">Tên đăng nhập</label><input id="username" name="username" class="form-control" autocomplete="username" required></div>
                <div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
                <button class="btn btn-warning w-100" type="submit">Đăng nhập</button>
            </form>
            <hr>
            <h2 class="h6">Đăng nhập nhanh (Demo)</h2>
            <div class="row g-2">
                <div class="col-sm-6" th:each="role : ${ {'Manager','Customer','SalesStaff','InventoryStaff'} }">
                    <form method="post" th:action="@{/login/demo}">
                        <input type="hidden" name="role" th:value="${role}">
                        <button class="btn btn-outline-primary w-100" type="submit" th:text="${role}">Demo role</button>
                    </form>
                </div>
            </div>
            <p class="small text-secondary mt-3 mb-0">Demo: manager/manager123, customer/customer123, sales/sales123, inventory/inventory123</p>
            <div class="text-center mt-3"><a th:href="@{/register}">Đăng ký tài khoản khách hàng</a></div>
        </div>
    </div>
</main>
</body>
</html>
