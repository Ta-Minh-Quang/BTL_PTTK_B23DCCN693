<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kho - RestMan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/dashboard}">RestMan</a><span class="text-white" th:text="${loggedUser.displayName}">Tên</span><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a></div></nav>
<main class="container py-4"><h1 class="h3 mb-3">Dashboard nhân viên kho</h1>
    <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4">
        <section class="col-lg-6"><div class="card border-0 shadow-sm h-100"><div class="card-body"><h2 class="h5">Nhập nguyên liệu</h2>
            <form method="post" th:action="@{/inventory/restock}"><label class="form-label">Nguyên liệu</label><select class="form-select mb-2" name="ingredientId" required><option th:each="i : ${ingredients}" th:value="${i.id}" th:text="${i.ingredientName + ' (' + i.unit + ') - tồn ' + i.quantityInStock}"></option></select><label class="form-label">Số lượng nhập thêm</label><input class="form-control mb-3" type="number" name="quantity" min="0.001" step="0.001" required><button class="btn btn-primary">Nhập kho</button></form>
        </div></div></section>
        <section class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Thêm nhà cung cấp</h2>
            <form method="post" th:action="@{/inventory/supplier}"><label class="form-label">Tên nhà cung cấp</label><input class="form-control mb-2" name="supplierName" required><label class="form-label">Điện thoại</label><input class="form-control mb-2" name="phone"><label class="form-label">Email</label><input class="form-control mb-2" type="email" name="email"><label class="form-label">Địa chỉ</label><input class="form-control mb-3" name="address"><button class="btn btn-primary">Thêm nhà cung cấp</button></form>
        </div></div></section>
        <section class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Nhà cung cấp</h2><div class="table-responsive"><table class="table"><thead><tr><th>Tên</th><th>Điện thoại</th><th>Email</th><th>Địa chỉ</th><th>Cập nhật</th></tr></thead><tbody>
            <tr th:each="s : ${suppliers}"><td colspan="5"><form class="row g-2 align-items-center" method="post" th:action="@{/inventory/supplier}"><input type="hidden" name="id" th:value="${s.id}"><div class="col-md-3"><input class="form-control" name="supplierName" th:value="${s.supplierName}" required></div><div class="col-md-2"><input class="form-control" name="phone" th:value="${s.phone}"></div><div class="col-md-2"><input class="form-control" name="email" type="email" th:value="${s.email}"></div><div class="col-md-3"><input class="form-control" name="address" th:value="${s.address}"></div><div class="col-md-2"><button class="btn btn-outline-primary">Lưu</button></div></form></td></tr>
            <tr th:if="${#lists.isEmpty(suppliers)}"><td>Chưa có nhà cung cấp.</td></tr>
        </tbody></table></div></div></div></section>
        <section class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Tồn kho nguyên liệu</h2><div class="table-responsive"><table class="table"><thead><tr><th>Nguyên liệu</th><th>Đơn vị</th><th>Tồn kho</th><th>Nhà cung cấp</th></tr></thead><tbody>
            <tr th:each="i : ${ingredients}"><td th:text="${i.ingredientName}"></td><td th:text="${i.unit}"></td><td th:text="${i.quantityInStock}"></td><td th:text="${i.supplierName}"></td></tr>
        </tbody></table></div></div></div></section>
    </div>
</main></body></html>
