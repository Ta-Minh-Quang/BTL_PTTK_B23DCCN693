<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký khách hàng - RestMan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width:760px">
    <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-2">Đăng ký tài khoản khách hàng</h1>
        <p class="text-secondary">Tạo tài khoản để đặt món và đặt bàn tại RestMan.</p>
        <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
        <form method="post" th:action="@{/register}">
            <div class="mb-3"><label class="form-label" for="username">Tên đăng nhập <span class="text-danger">*</span></label><input id="username" class="form-control" name="username" th:value="${username}" maxlength="60" autocomplete="username" required></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label" for="password">Mật khẩu <span class="text-danger">*</span></label><input id="password" class="form-control" type="password" name="password" autocomplete="new-password" required></div>
                <div class="col-md-6"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu <span class="text-danger">*</span></label><input id="confirmPassword" class="form-control" type="password" name="confirmPassword" autocomplete="new-password" required></div>
            </div>
            <div class="mb-3 mt-3"><label class="form-label" for="fullName">Họ và tên <span class="text-danger">*</span></label><input id="fullName" class="form-control" name="fullName" th:value="${fullName}" maxlength="160" autocomplete="name" required></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label" for="phone">Số điện thoại</label><input id="phone" class="form-control" name="phone" th:value="${phone}" maxlength="20" autocomplete="tel"></div>
                <div class="col-md-6"><label class="form-label" for="email">Email</label><input id="email" class="form-control" type="email" name="email" th:value="${email}" maxlength="120" autocomplete="email"></div>
            </div>
            <div class="mt-3 mb-4"><label class="form-label" for="address">Địa chỉ</label><input id="address" class="form-control" name="address" th:value="${address}" maxlength="150" autocomplete="street-address"></div>
            <button class="btn btn-warning w-100" type="submit">Tạo tài khoản</button>
        </form>
        <div class="text-center mt-3"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
    </div></div>
</main>
</body>
</html>
