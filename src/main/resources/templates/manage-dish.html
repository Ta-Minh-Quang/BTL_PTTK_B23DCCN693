<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý món - RestMan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/dashboard}">RestMan</a><div class="navbar-nav flex-row gap-3"><a class="nav-link" th:href="@{/search}">Thực đơn</a><a class="nav-link active" th:href="@{/dishes}">Quản lý món</a><a class="nav-link" th:href="@{/combo}">Quản lý combo</a><a class="nav-link" th:href="@{/statistics}">Thống kê</a></div><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a></div></nav>
<main class="container py-4"><h1 class="h3 mb-3">Quản lý món ăn</h1>
    <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5" th:text="${editDish != null ? 'Sửa món ăn' : 'Thêm món mới'}">Thêm món mới</h2>
        <form method="post" th:action="@{/dishes/save}" class="row g-3">
            <input type="hidden" name="id" th:value="${editDish != null ? editDish.id : 0}">
            <div class="col-md-4"><label class="form-label">Tên món</label><input class="form-control" name="dishName" th:value="${editDish != null ? editDish.dishName : ''}" required></div>
            <div class="col-md-2"><label class="form-label">Giá</label><input class="form-control" type="number" name="price" min="0" step="0.01" th:value="${editDish != null ? editDish.price : ''}" required></div>
            <div class="col-md-3"><label class="form-label">Thể loại</label><input class="form-control" name="category" th:value="${editDish != null ? editDish.category : ''}" list="categories" required><datalist id="categories"><option th:each="c : ${categories}" th:value="${c}"></option></datalist></div>
            <div class="col-md-3"><label class="form-label">Ảnh (URL)</label><input class="form-control" name="imageUrl" th:value="${editDish != null ? editDish.imageUrl : ''}"></div>
            <div class="col-md-8"><label class="form-label">Mô tả</label><textarea class="form-control" name="description" th:text="${editDish != null ? editDish.description : ''}"></textarea></div>
            <div class="col-md-2 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="available" value="true" th:checked="${editDish == null or editDish.available}"><label class="form-check-label">Đang bán</label></div></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-warning w-100" th:text="${editDish != null ? 'Lưu sửa đổi' : 'Thêm món'}">Thêm món</button></div>
        </form>
    </div></div>
    <div class="card border-0 shadow-sm"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Tên món</th><th>Thể loại</th><th>Giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
        <tr th:each="dish : ${dishes}"><td th:text="${dish.dishName}"></td><td th:text="${dish.category}"></td><td th:text="${dish.price}"></td><td th:text="${dish.available ? 'Đang bán' : 'Ngừng bán'}"></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/dishes(editId=${dish.id})}">Sửa</a><form method="post" th:action="@{'/dishes/delete/' + ${dish.id}}" onsubmit="return confirm('Xóa món ăn này?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr>
        <tr th:if="${#lists.isEmpty(dishes)}"><td colspan="5">Chưa có món ăn.</td></tr>
    </tbody></table></div></div></div>
</main></body></html>
