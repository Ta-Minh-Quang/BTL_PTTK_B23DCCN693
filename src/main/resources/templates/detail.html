<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết món - RestMan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/dashboard}">RestMan</a><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a></div></nav>
<main class="container py-5">
    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <article class="card border-0 shadow-sm" th:if="${dish != null}">
        <img th:if="${dish.imageUrl != null and !#strings.isEmpty(dish.imageUrl)}" th:src="${dish.imageUrl}" class="card-img-top" style="height:320px;object-fit:cover" alt="">
        <div class="card-body p-4"><span class="badge text-bg-warning" th:text="${dish.category}">Thể loại</span>
            <h1 class="h2 mt-3" th:text="${dish.dishName}">Tên món</h1>
            <p class="fs-4 fw-bold text-warning-emphasis" th:text="${#numbers.formatDecimal(dish.price,0,'COMMA',0,'POINT')} + ' VND'">0 VND</p>
            <p th:text="${dish.description}">Mô tả món ăn</p>
            <p th:text="${dish.available ? 'Còn phục vụ' : 'Hết món'}">Trạng thái</p>
        </div>
    </article>
    <a class="btn btn-dark mt-3" th:href="@{/search}">Quay lại danh sách</a>
</main>
</body></html>
