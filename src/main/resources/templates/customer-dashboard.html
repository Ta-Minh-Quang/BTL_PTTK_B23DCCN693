<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khách hàng - RestMan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" th:href="@{/dashboard}">RestMan</a>
    <div class="d-flex gap-3 align-items-center"><a class="text-white text-decoration-none" th:href="@{/search}">Thực đơn</a><span class="text-white" th:text="${loggedUser.displayName}">Tên</span><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a></div>
</div></nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Đặt món trực tuyến</h1>
    <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4 align-items-start">
        <section class="col-lg-7">
            <div class="card border-0 shadow-sm"><div class="card-body">
                <h2 class="h5">Thực đơn</h2>
                <form class="row g-2 mb-3" method="get" th:action="@{/dashboard}">
                    <div class="col-md-6"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên món"></div>
                    <div class="col-md-4"><select class="form-select" name="category"><option value="">Tất cả thể loại</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option></select></div>
                    <div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Lọc</button></div>
                </form>
                <div class="list-group">
                    <div class="list-group-item" th:each="dish : ${dishes}" th:if="${dish.available}">
                        <form class="row g-2 align-items-center" method="post" th:action="@{/order/online/cart/add}">
                            <input type="hidden" name="dishId" th:value="${dish.id}"><input type="hidden" name="keyword" th:value="${keyword}"><input type="hidden" name="category" th:value="${category}">
                            <div class="col-md-6"><div class="fw-semibold" th:text="${dish.dishName}">Tên món</div><small class="text-secondary" th:text="${dish.category}">Thể loại</small></div>
                            <div class="col-md-3 fw-semibold" th:text="${#numbers.formatDecimal(dish.price,0,'COMMA',0,'POINT')} + ' VND'">0 VND</div>
                            <div class="col-md-1"><input class="form-control form-control-sm" type="number" name="quantity" min="1" value="1" aria-label="Số lượng" required></div>
                            <div class="col-md-2 d-grid"><button class="btn btn-sm btn-primary">Thêm vào đơn</button></div>
                        </form>
                    </div>
                    <div class="list-group-item text-secondary" th:if="${#lists.isEmpty(dishes)}">Không tìm thấy món ăn phù hợp với từ khóa</div>
                </div>
            </div></div>
        </section>
        <section class="col-lg-5">
            <div class="card border-0 shadow-sm"><div class="card-body">
                <h2 class="h5">Giỏ hàng</h2>
                <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-light border">Vui lòng chọn ít nhất 1 món ăn.</div>
                <div class="table-responsive" th:unless="${#lists.isEmpty(cartItems)}">
                    <table class="table align-middle"><thead><tr><th>Món / Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr></thead>
                        <tbody><tr th:each="item : ${cartItems}" data-cart-row th:attr="data-unit-price=${item.unitPrice},data-dish-id=${item.dishId}">
                            <td><span class="fw-semibold" th:text="${item.dishName}">Món</span><small class="d-block text-secondary" th:text="${#numbers.formatDecimal(item.unitPrice,0,'COMMA',0,'POINT')} + ' VND'">Đơn giá</small></td>
                            <td><form class="d-flex gap-1" method="post" th:action="@{/order/online/cart/update}">
                                <input type="hidden" name="dishId" th:value="${item.dishId}"><input type="hidden" name="keyword" th:value="${keyword}"><input type="hidden" name="category" th:value="${category}">
                                <input class="form-control form-control-sm" style="width:72px" type="number" name="quantity" min="1" th:value="${item.quantity}" data-cart-quantity aria-label="Số lượng" required><button class="btn btn-sm btn-outline-primary">Cập nhật</button>
                            </form></td>
                            <td class="text-nowrap" data-line-total th:text="${#numbers.formatDecimal(item.lineTotal,0,'COMMA',0,'POINT')} + ' VND'">Thành tiền</td>
                            <td><form method="post" th:action="@{/order/online/cart/remove}"><input type="hidden" name="dishId" th:value="${item.dishId}"><input type="hidden" name="keyword" th:value="${keyword}"><input type="hidden" name="category" th:value="${category}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td>
                        </tr></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between border-top pt-3 mb-3"><strong>Tổng tiền</strong><strong class="fs-5 text-primary" id="totalAmount" th:text="${#numbers.formatDecimal(totalAmount,0,'COMMA',0,'POINT')} + ' VND'">0 VND</strong></div>
                <form method="post" th:action="@{/order/online/submit}" data-cart-submit><input type="hidden" name="keyword" th:value="${keyword}"><input type="hidden" name="category" th:value="${category}"><button class="btn btn-success w-100">Xác nhận đặt món</button></form>
            </div></div>
        </section>
    </div>
    <section class="card border-0 shadow-sm mt-4"><div class="card-body">
        <h2 class="h5">Đặt bàn trực tuyến</h2>
        <form class="row g-2" method="post" th:action="@{/reservation}">
            <div class="col-md-4"><label class="form-label">Ngày và giờ</label><input class="form-control" type="datetime-local" name="reservationTime" required></div>
            <div class="col-md-4"><label class="form-label">Bàn trống</label><select class="form-select" name="tableId" required><option th:each="table : ${tables}" th:value="${table.id}" th:text="${table.tableName + ' - ' + table.capacity + ' chỗ'}"></option></select></div>
            <div class="col-md-2"><label class="form-label">Số khách</label><input class="form-control" type="number" name="guestCount" min="1" value="2" required></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-success w-100">Đặt bàn</button></div>
        </form>
    </div></section>
</main>
<script>
(() => {
    const format = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
    const updateTotals = () => {
        let total = 0;
        document.querySelectorAll('[data-cart-row]').forEach(row => {
            const quantity = Number(row.querySelector('[data-cart-quantity]').value) || 0;
            const lineTotal = Number(row.dataset.unitPrice) * quantity;
            total += lineTotal;
            row.querySelector('[data-line-total]').textContent = `${format.format(lineTotal)} VND`;
        });
        const totalElement = document.querySelector('#totalAmount');
        if (totalElement) totalElement.textContent = `${format.format(total)} VND`;
    };
    document.querySelectorAll('[data-cart-quantity]').forEach(input => input.addEventListener('input', updateTotals));
    const submitForm = document.querySelector('[data-cart-submit]');
    if (submitForm) {
        submitForm.addEventListener('submit', event => {
            const form = event.currentTarget;
            document.querySelectorAll('[data-cart-row]').forEach(row => {
                const fields = [['cartDishIds', row.dataset.dishId], ['cartQuantities', row.querySelector('[data-cart-quantity]').value]];
                fields.forEach(([name, value]) => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = name;
                    input.value = value;
                    form.appendChild(input);
                });
            });
        });
    }
})();
</script>
</body>
</html>
