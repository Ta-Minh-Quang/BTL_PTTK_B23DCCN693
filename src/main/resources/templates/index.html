<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thực đơn - RestMan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" th:href="@{/dashboard}">RestMan</a>
    <div class="navbar-nav me-auto">
        <a class="nav-link active" th:href="@{/search}">Thực đơn</a>
        <a class="nav-link" th:if="${loggedUser.role == 'Manager'}" th:href="@{/dishes}">Quản lý món</a>
        <a class="nav-link" th:if="${loggedUser.role == 'Manager'}" th:href="@{/combo}">Quản lý combo</a>
        <a class="nav-link" th:if="${loggedUser.role == 'Manager'}" th:href="@{/statistics}">Thống kê</a>
    </div>
    <span class="text-white me-3" th:text="${loggedUser.displayName}">Tên</span><a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a>
</div></nav>
<main class="container py-4">
    <h1 class="h3">Tìm kiếm món ăn</h1>
    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error == 'DishNotFound' ? 'Không tìm thấy món ăn.' : error}"></div>
    <form class="row g-2 my-3" method="get" th:action="@{/search}">
        <div class="col-md-6"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tên món ăn"></div>
        <div class="col-md-4"><select class="form-select" name="category"><option value="">Tất cả thể loại</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item}" th:selected="${item == category}"></option></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-warning" type="submit">Tìm kiếm</button></div>
    </form>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="dish : ${dishList}">
            <article class="card h-100 shadow-sm border-0">
                <img class="card-img-top" style="height:180px;object-fit:cover" th:if="${dish.imageUrl != null and !#strings.isEmpty(dish.imageUrl)}" th:src="${dish.imageUrl}" alt="">
                <div class="card-body"><h2 class="h5"><a class="link-dark" th:href="@{'/dish/' + ${dish.id}}" th:text="${dish.dishName}">Tên món</a></h2>
                    <p class="text-secondary" th:text="${dish.category}">Thể loại</p>
                    <p class="fw-bold" th:text="${#numbers.formatDecimal(dish.price,0,'COMMA',0,'POINT')} + ' VND'">0 VND</p>
                    <a class="btn btn-outline-dark" th:href="@{'/dish/' + ${dish.id}}">Xem chi tiết</a>
                </div>
            </article>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(dishList)}"><div class="alert alert-light border">Không tìm thấy món ăn phù hợp với từ khóa</div></div>
    </div>
</main>
</body>
</html>
